# Built-in defaults for `paideia-cli`: this protocol instance's genesis conf (see
# genesis/paideia-mainnet.conf - a byte-for-byte copy of paideia-state's own
# conf/genesis/paideia-mainnet.conf) plus the CLI-local settings a StateLifecycle replay
# needs even though the CLI itself never submits an operator transaction.
#
# NOT loaded via the usual `ConfigFactory.load()` / `application.conf` convention on
# purpose: paideia-sdk's own src/main/resources/application.conf (dummy identity values
# used only by the sdk's own test suite) ships on this fat JAR's classpath too, and
# Typesafe Config's layering gives an application.conf HIGHER priority than a
# reference.conf - so a generic ConfigFactory.load() here would silently let that
# dummy sdk config win over this file's real genesis values. Main.scala instead parses
# this resource explicitly by name (ConfigFactory.parseResources("cli-defaults.conf")),
# never touching ConfigFactory.load()'s default application.conf/reference.conf
# resolution at all. See Main.scala's `loadConfig`.
include "genesis/paideia-mainnet.conf"

paideia {
    # Ergo node this CLI talks to for both replay (BlockSource) and box lookups
    # (IndexedNodeClient) - must have the blockchain-indexer API enabled.
    node = "http://localhost:9053"
    node = ${?ERGO_NODE}

    # Dereferenced by contract event-handling while replaying confirmed blocks (bot-tx
    # generation reads Env.operatorAddress even though the CLI never submits what it
    # builds - see StateLifecycle's lenient sink) - not otherwise used by the CLI.
    operatorAddress = "9h7L7sUHZk43VQC3PHtSp5ujAWcZtYmWATBH746wi75C5XHi68b"

    compoundBatchSize = 1000
    defaultBotFee = 1000

    # How often (in blocks) StateLifecycle checkpoints while replaying.
    checkpointInterval = 100
}
